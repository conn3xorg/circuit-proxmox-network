name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# e2e needs a Proxmox VE node, which a container can't be: examples/local
# boots a Debian 13 VM under KVM and turns it into one with circuit-proxmox.
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the examples
        run: |
          for dir in examples/local examples/local/node; do
            (cd "$dir" && conn3x init -backend=false && conn3x validate)
          done

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    name: e2e (debian13, pve-9)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: *gh
        run: *install
      # Hosted Ubuntu runners have KVM, but /dev/kvm isn't open to the
      # runner user until a udev rule says so.
      - name: Install QEMU and open up KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Start a Proxmox VE node
        working-directory: examples/local
        run: ./up.sh
      # Apply with the provider release before the pinned one first, then
      # move to the pin, as anyone upgrading this circuit does.
      - name: Apply with the previous provider release, 0.119.0
        working-directory: examples/local
        run: |
          sed -i 's/version = "0.120.0"/version = "0.119.0"/' ../../versions.tf
          conn3x init
          conn3x apply -auto-approve
      - name: Upgrade to the pinned provider, apply, then plan again with no changes
        working-directory: examples/local
        run: |
          git checkout -- ../../versions.tf
          conn3x init -upgrade
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Send traffic through the bridge and VNets
        working-directory: examples/local
        run: ./check.sh
      - name: Check the API token stayed out of state
        working-directory: examples/local
        run: |
          secret=$(sed -n 's/^api_token *= "[^=]*=\(.*\)"$/\1/p' lab.auto.tfvars)
          [ -n "$secret" ]
          if grep -qF "$secret" terraform.tfstate; then echo "The API token is in the state." >&2; exit 1; fi
      - name: Change the bridge by hand, and see drift
        working-directory: examples/local
        run: |
          ssh -q -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 \
            'pvesh set /nodes/pve1/network/vmbr10 --type bridge --bridge_vlan_aware 1 --comments changed-by-hand && pvesh set /nodes/pve1/network'
          rc=0
          conn3x drift || rc=$?
          [ "$rc" -eq 2 ] || { echo "drift exited $rc, not 2." >&2; exit 1; }
      - name: Apply again, then plan with no changes
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Reboot the node
        working-directory: examples/local
        run: |
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 'systemctl reboot' || true
          sleep 10
          for i in $(seq 100); do
            ssh -q -o ConnectTimeout=5 -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 'pvesh get /nodes/pve1/network/vmbr10 >/dev/null' && break
            [ "$i" -lt 100 ] || { echo "The node didn't come back after the reboot." >&2; exit 1; }
            sleep 3
          done
      - name: Send traffic again after the reboot
        working-directory: examples/local
        run: ./check.sh
      - name: Plan again after the reboot, with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: Show the VM's console and the node's network
        if: failure()
        working-directory: examples/local
        run: |
          tail -n 60 serial.log || true
          ssh -o UserKnownHostsFile=known_hosts -i id_ed25519 -p 2222 root@127.0.0.1 'cat /etc/network/interfaces; ls -la /etc/network; grep -n source /etc/network/interfaces*; ls -la /etc/network/interfaces.d; cat /etc/network/interfaces.d/sdn; ip -br link; bridge vlan; systemctl status networking --no-pager; ifreload -a -d 2>&1 | grep -iE "error|warn" | tail -30' || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
